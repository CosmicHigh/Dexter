<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Dexter</title>
<style>
/* ════════════════════════════════════════════════════════════
   Dexter — iOS 26 Liquid Glass v2
   Layered blur depths · specular edge highlights · spring physics
   ════════════════════════════════════════════════════════════ */
:root {
  --base:        #070809;
  --base-2:      #0b0d11;

  --t-primary:   #FFFFFF;
  --t-secondary: rgba(184,189,196,0.72);
  --t-tertiary:  #71767E;
  --t-quaternary: rgba(113,118,126,0.55);

  --accent:      #5AC8FA;
  --accent-deep: #0A84FF;
  --amber:       #FFB340;
  --red:         #FF6961;

  --r-sheet: 34px;
  --r-card:  22px;
  --r-tile:  16px;

  /* Apple-feel motion curves */
  --spring:     cubic-bezier(0.34, 1.36, 0.34, 1);   /* overshoot + settle */
  --spring-soft:cubic-bezier(0.30, 1.15, 0.40, 1);
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);
  --ease-swift: cubic-bezier(0.4, 0.0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--base); overscroll-behavior: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  color: var(--t-primary);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }

#app {
  position: relative; width: 100%;
  min-height: 100vh; min-height: 100dvh;
  background: var(--base); overflow: hidden;
}

/* ── ambient backdrop the glass refracts ── */
.bloom {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(120% 60% at 50% -4%, rgba(86,104,232,0.32), transparent 56%),
    radial-gradient(90% 50% at 82% 5%, rgba(128,84,228,0.20), transparent 52%),
    radial-gradient(140% 70% at 50% 106%, rgba(18,42,96,0.34), transparent 58%),
    var(--base);
}
.bloom-2 {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .55;
  background: radial-gradient(72% 46% at 50% 30%, rgba(90,200,250,0.055), transparent 70%);
}

/* ════════════════════════════════════════════
   GLASS MATERIALS — three depth tiers
   Each: layered translucency + blur+saturate + top specular line
   ════════════════════════════════════════════ */

/* tier 1 — sheets (modals, hero): deepest blur, brightest specular */
.glass-sheet {
  position: relative;
  background: linear-gradient(178deg, rgba(255,255,255,0.105), rgba(255,255,255,0.045) 38%, rgba(255,255,255,0.028));
  backdrop-filter: blur(34px) saturate(185%) brightness(1.10);
  -webkit-backdrop-filter: blur(34px) saturate(185%) brightness(1.10);
  border-radius: var(--r-sheet);
  border: 0.5px solid rgba(255,255,255,0.16);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.24),
    inset 0 -1px 0 rgba(255,255,255,0.04),
    inset 1px 0 0 rgba(255,255,255,0.06),
    inset -1px 0 0 rgba(255,255,255,0.06),
    0 18px 48px rgba(0,0,0,0.52),
    0 2px 10px rgba(0,0,0,0.30);
}
/* modal/overlay sheets: near-solid dark base so they stay opaque even when
   the WebView drops nested backdrop-filter (Chrome/Android bug). The blur is
   a bonus on top; the base fill carries the look on its own. */
.glass-modal {
  position: relative;
  background:
    linear-gradient(178deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.02)),
    linear-gradient(180deg, rgba(22,25,32,0.97), rgba(13,15,20,0.985));
  backdrop-filter: blur(40px) saturate(180%) brightness(1.06);
  -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.06);
  border-radius: var(--r-sheet);
  border: 0.5px solid rgba(255,255,255,0.16);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    inset 0 -1px 0 rgba(255,255,255,0.04),
    0 18px 54px rgba(0,0,0,0.62),
    0 2px 10px rgba(0,0,0,0.4);
}
.glass-modal::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 22%, rgba(255,255,255,0.06) 40%, transparent 60%);
  mix-blend-mode: screen;
}
.glass-modal.glass-amber {
  background:
    linear-gradient(178deg, rgba(255,179,64,0.16), rgba(255,179,64,0.04) 55%, rgba(255,255,255,0.015)),
    linear-gradient(180deg, rgba(40,30,14,0.97), rgba(20,15,8,0.985));
  border-color: rgba(255,179,64,0.32);
}

/* tier 2 — cards: medium blur */
.glass-card {
  position: relative;
  background: linear-gradient(178deg, rgba(255,255,255,0.085), rgba(255,255,255,0.035) 45%, rgba(255,255,255,0.022));
  backdrop-filter: blur(26px) saturate(170%) brightness(1.07);
  -webkit-backdrop-filter: blur(26px) saturate(170%) brightness(1.07);
  border-radius: var(--r-card);
  border: 0.5px solid rgba(255,255,255,0.125);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -1px 0 rgba(255,255,255,0.03),
    0 10px 30px rgba(0,0,0,0.40);
}
/* tier 3 — tiles & capsules: light blur */
.glass-tile {
  position: relative;
  background: linear-gradient(178deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03));
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-radius: var(--r-tile);
  border: 0.5px solid rgba(255,255,255,0.11);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 6px 18px rgba(0,0,0,0.28);
}
.capsule {
  position: relative;
  background: linear-gradient(178deg, rgba(255,255,255,0.085), rgba(255,255,255,0.032));
  backdrop-filter: blur(22px) saturate(170%);
  -webkit-backdrop-filter: blur(22px) saturate(170%);
  border-radius: 999px;
  border: 0.5px solid rgba(255,255,255,0.13);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), inset 0 -1px 0 rgba(255,255,255,0.03), 0 8px 24px rgba(0,0,0,0.35);
}

/* moving specular sweep on sheets — the "light catch" */
.glass-sheet::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.075) 38%, rgba(255,255,255,0.02) 52%, transparent 64%);
  mix-blend-mode: screen;
}
.glass-card::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,0.05) 42%, transparent 58%);
  mix-blend-mode: screen;
}

/* tinted glass variants */
.glass-amber {
  background: linear-gradient(178deg, rgba(255,179,64,0.14), rgba(255,179,64,0.05) 50%, rgba(255,255,255,0.02));
  border-color: rgba(255,179,64,0.30);
  box-shadow:
    inset 0 1px 0 rgba(255,210,140,0.30), inset 0 -1px 0 rgba(255,179,64,0.05),
    0 14px 40px rgba(0,0,0,0.5), 0 0 36px rgba(255,179,64,0.10);
}
.glass-red {
  background: linear-gradient(178deg, rgba(255,105,97,0.13), rgba(255,105,97,0.045));
  border-color: rgba(255,105,97,0.28);
  box-shadow: inset 0 1px 0 rgba(255,150,140,0.25), 0 8px 24px rgba(0,0,0,0.35);
}

/* glowing accent capsule (primary actions) */
.accent-capsule {
  position: relative;
  background: linear-gradient(180deg, rgba(110,210,255,0.92), rgba(10,132,255,0.78) 55%, rgba(8,110,220,0.82));
  border-radius: 999px;
  border: 0.5px solid rgba(170,225,255,0.65);
  color: #fff;
  box-shadow:
    0 0 28px rgba(90,200,250,0.40),
    0 8px 26px rgba(10,100,210,0.45),
    inset 0 1.5px 1px rgba(255,255,255,0.55),
    inset 0 -6px 14px rgba(6,80,170,0.45);
}
.accent-capsule::before {
  content: ''; position: absolute; left: 8%; right: 8%; top: 2px; height: 42%;
  border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.38), transparent);
}

/* ── typography ── */
.label {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--t-tertiary);
}
.metric { font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* ════════════════════════════════════════════
   MOTION — spring physics
   ════════════════════════════════════════════ */
.tap { cursor: pointer; transition: transform .14s var(--ease-out), opacity .14s ease, box-shadow .2s ease; }
.tap:active { transform: scale(0.955); opacity: .88; }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(12px) scale(0.992); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.anim-screen { animation: screenIn .42s var(--ease-out) both; }

@keyframes popIn {
  0%   { opacity: 0; transform: scale(0.90); }
  62%  { opacity: 1; transform: scale(1.022); }
  100% { opacity: 1; transform: scale(1); }
}
.anim-pop { animation: popIn .46s var(--spring-soft) both; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.anim-fade { animation: fadeIn .30s ease both; }

/* sheet: slides up, stretches 1.5% past, settles — Apple sheet physics */
@keyframes sheetIn {
  0%   { transform: translateY(104%); }
  72%  { transform: translateY(-1.4%); }
  88%  { transform: translateY(0.5%); }
  100% { transform: translateY(0); }
}
.anim-sheet { animation: sheetIn .56s var(--ease-out) both; }

@keyframes dimIn { from { opacity: 0; } to { opacity: 1; } }
.sheet-backdrop { animation: dimIn .34s ease both; }

/* checkmark spring pop */
@keyframes checkPop {
  0%   { transform: scale(0.55); }
  55%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}
.anim-check { animation: checkPop .38s var(--spring) both; }

@keyframes glowPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.55; }
}

/* stepper value tick */
@keyframes valueTick {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.anim-tick { animation: valueTick .22s var(--ease-out) both; }

/* toast rise */
@keyframes toastIn {
  0%   { opacity: 0; transform: translateY(14px) scale(.95); }
  70%  { opacity: 1; transform: translateY(-2px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.anim-toast { animation: toastIn .42s var(--spring-soft) both; }

/* ── layout ── */
.screen {
  position: relative; z-index: 5;
  height: 100vh; height: 100dvh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 122px);
}
.noscroll::-webkit-scrollbar { display: none; }
.noscroll { scrollbar-width: none; }

.tabbar {
  position: fixed; left: 14px; right: 14px;
  bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 40;
  display: flex; justify-content: space-between; padding: 9px 10px;
}
.tabitem { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3.5px; padding: 4px 0; }

.overlay { position: fixed; inset: 0; z-index: 35; }
.sheet-wrap { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop {
  position: absolute; inset: 0;
  background: rgba(2,3,5,0.66);
  backdrop-filter: blur(12px) saturate(120%);
  -webkit-backdrop-filter: blur(12px) saturate(120%);
}

input, button, textarea { font-family: inherit; }
input:focus, textarea:focus { outline: none; }
button { cursor: pointer; border: none; background: none; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.text-input {
  width: 100%; padding: 14px 16px; border-radius: 15px; font-size: 16px; color: #fff;
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.16);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.25);
}
.text-input:focus { border-color: rgba(90,200,250,0.45); box-shadow: inset 0 1px 2px rgba(0,0,0,0.25), 0 0 0 3px rgba(90,200,250,0.10); }

/* segmented control */
.seg { display: flex; padding: 4px; border-radius: 17px; }
.seg-item { flex: 1; padding: 11px 0; border-radius: 13px; text-align: center; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--t-secondary); transition: color .2s ease; }

/* toggle pill */
.toggle { width: 48px; height: 29px; border-radius: 999px; padding: 2.5px; transition: background .25s var(--ease-out), box-shadow .25s; background: rgba(255,255,255,0.10); border: 0.5px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
.toggle .knob { width: 23px; height: 23px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform .25s var(--spring-soft); }
.toggle.on { background: linear-gradient(180deg, rgba(110,210,255,0.9), rgba(10,132,255,0.8)); border-color: rgba(170,225,255,0.5); box-shadow: 0 0 14px rgba(90,200,250,0.35), inset 0 1px 1px rgba(255,255,255,0.4); }
.toggle.on .knob { transform: translateX(19px); }
</style>
</head>
